<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheOf’Doom MC Tiers</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0410;--card:#160a1f;--text:#f6ecff;--mute:#a68bb8;--line:#3a1b4d;--acc:#ff1aff;--accT:#14001a}
:root[data-theme="light"]{--bg:#fbefff;--card:#fff;--text:#1a0524;--mute:#7a5a8c;--line:#ecd0f7;--acc:#c400c4;--accT:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Sarabun,sans-serif;line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:20px;margin:0}h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
button{font:inherit;cursor:pointer;color:inherit}
.ic{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.modes button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px}
.modes button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.bar{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:0 12px}
.seg button.on{background:var(--acc);color:var(--accT)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.rk{width:34px;font-weight:700;text-align:center;color:var(--mute)}
.r1{color:#e8b100}.r2{color:#9aa3b5}.r3{color:#c27c3a}
.av{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mute)}
.reg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.tc{font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;color:#fff;white-space:nowrap}
.cols{display:grid;gap:10px}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.col h3{margin:0;padding:8px 12px;color:#fff;font-size:15px}
.col div{padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px}
.col button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.col .ht{border-color:var(--acc)}
.empty{color:var(--mute);font-size:13px}
dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:18px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.fm{display:grid;gap:10px;margin:12px 0}.fm label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
.go{background:var(--acc);color:var(--accT);border-color:var(--acc);flex:1}
.logo{width:44px;height:44px;image-rendering:pixelated}
body{background-image:conic-gradient(#ff1aff10 25%,transparent 0 50%,#ff1aff10 0 75%,transparent 0);background-size:48px 48px}
h1 span{text-shadow:0 0 14px var(--acc)}
.row:hover{border-color:var(--acc)}
.note{margin-top:20px;color:var(--mute);font-size:12px;text-align:center}
</style>
</head>

 <div style="display:flex;gap:6px"><button class="ic" id="adm" hidden>🔑 แอดมิน</button><button class="ic" id="th">🌓</button></div>
</header>
<div class="modes" id="modes"></div>
<div class="bar">
 <input id="q" placeholder="ค้นหาชื่อผู้เล่น…">
 <div class="seg"><button id="v1" class="on">อันดับ</button><button id="v2">Tier</button></div>
</div>
<div id="out"></div>

</div>
<dialog id="dlg"></dialog>
<dialog id="adlg"><b style="font-size:17px">🔑 แผงแอดมิน – ให้ Tier</b>
<div class="fm">
<label>ชื่อผู้เล่น<input id="an" list="pl" placeholder="เลือกหรือพิมพ์ชื่อใหม่"></label><datalist id="pl"></datalist>
<label>ภูมิภาค<select id="ar"></select></label>
<label>โหมด<select id="am"></select></label>
<label>Tier<select id="at"></select></label>
<div style="display:flex;gap:8px"><button class="ic go" id="asv">บันทึก Tier</button><button class="ic" id="adel">ลบผู้เล่น</button></div>
<small id="ast" style="color:var(--mute)"></small>
</div><button class="ic" style="width:100%" onclick="adlg.close()">ปิด</button></dialog>
<script>
const MODES={all:'Overall',beast:'Beast',axe:'Axe',uhc:'UHC',dpot:'Diamond Pot',nop:'Netherite OP',mace:'Mace',cart:'Cart',spear:'Spear',dsmp:'Diamond SMP',nsmp:'Netherite SMP',crystal:'Crystal PVP'};
const SHORT={beast:'Beast',axe:'Axe',uhc:'UHC',dpot:'D.Pot',nop:'N.OP',mace:'Mace',cart:'Cart',spear:'Spear',dsmp:'D.SMP',nsmp:'N.SMP',crystal:'Crystal'};
const PTS={HT1:60,LT1:44,HT2:32,LT2:20,HT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1};
const TCOL={1:'#e0a400',2:'#8a94a8',3:'#b8702e',4:'#3a7bd5',5:'#4a9a6a'};
const RCOL={AS:'#d9534f',NA:'#3a7bd5',EU:'#4a9a6a',SA:'#e08a00',AU:'#8a5ad0'};
let PLAYERS=[];
let mode='all',view=1,q='';
const pts=p=>Object.values(p.t).reduce((s,x)=>s+PTS[x],0);
const tn=t=>+t[2];
const chip=(m,t)=>`<span class="tc" style="background:${TCOL[tn(t)]}">${m!=null?SHORT[m]+' ':''}${t}</span>`;
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 55% 45%)`};
function list(){
 let a=PLAYERS.filter(p=>p.n.toLowerCase().includes(q.toLowerCase()));
 if(mode!=='all')a=a.filter(p=>p.t[mode]);
 const sc=p=>mode==='all'?pts(p):PTS[p.t[mode]];
 return a.sort((x,y)=>sc(y)-sc(x));
}
function render(){
 const a=list(),o=document.getElementById('out');
 if(!a.length){o.innerHTML='<p class="empty">ยังไม่มีผู้เล่น – แอดมินกด 🔑 เพื่อเพิ่มและให้ Tier</p>';return}
 if(view===1){
  o.innerHTML=a.map((p,i)=>{
   const ch=mode==='all'?Object.entries(p.t).map(([m,t])=>chip(m,t)).join(''):chip(null,p.t[mode]);
   return`<button class="row" data-n="${p.n}"><div class="rk r${i+1}">${i+1}</div><div class="av" style="background:${col(p.n)}">${p.n[0]}</div><div class="nm"><b>${p.n}</b><small>${mode==='all'?pts(p)+' แต้ม':'Bedrock'}</small></div><span class="reg" style="background:${RCOL[p.r]}">${p.r}</span><div class="chips">${ch}</div></button>`}).join('');
 }else{
  const m=mode==='all'?'crystal':mode;
  const b=PLAYERS.filter(p=>p.t[m]&&p.n.toLowerCase().includes(q.toLowerCase()));
  o.innerHTML=`<p class="sub" style="margin-bottom:8px">โหมด: ${MODES[m]}${mode==='all'?' (เลือกโหมดด้านบนเพื่อเปลี่ยน)':''}</p><div class="cols">`+[1,2,3,4,5].map(n=>{
   const ps=b.filter(p=>tn(p.t[m])===n).sort((x,y)=>PTS[y.t[m]]-PTS[x.t[m]]);
   return`<div class="col"><h3 style="background:${TCOL[n]}">Tier ${n}</h3><div>${ps.map(p=>`<button data-n="${p.n}" class="${p.t[m][0]==='H'?'ht':''}">${p.t[m]} · ${p.n}</button>`).join('')||'<span class="empty">—</span>'}</div></div>`}).join('')+'</div>';
 }
}
document.getElementById('modes').innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-m="${k}" class="${k===mode?'on':''}">${v}</button>`).join('');
document.getElementById('modes').onclick=e=>{const k=e.target.dataset.m;if(!k)return;mode=k;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b.dataset.m===k));render()};
document.getElementById('q').oninput=e=>{q=e.target.value;render()};
const setV=n=>{view=n;v1.classList.toggle('on',n===1);v2.classList.toggle('on',n===2);render()};
v1.onclick=()=>setV(1);v2.onclick=()=>setV(2);
document.getElementById('out').onclick=e=>{
 const n=e.target.closest('[data-n]')?.dataset.n;if(!n)return;
 const p=PLAYERS.find(x=>x.n===n),d=document.getElementById('dlg');
 d.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><div class="av" style="background:${col(p.n)};width:52px;height:52px;font-size:22px">${p.n[0]}</div><div><b style="font-size:18px">${p.n}</b><br><span class="reg" style="background:${RCOL[p.r]}">${p.r}</span> <small style="color:var(--mute)">${pts(p)} แต้ม</small></div></div><div class="g">${Object.entries(MODES).filter(([k])=>k!=='all').map(([k,v])=>`<div>${v}${p.t[k]?chip(null,p.t[k]):'<span class="empty">—</span>'}</div>`).join('')}</div><button class="ic" style="width:100%;margin-top:14px" onclick="dlg.close()">ปิด</button>`;
 d.showModal();
};
document.getElementById('dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
th.onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
let dbDoc=null;
const opt=(v,t)=>`<option value="${v}">${t}</option>`;
ar.innerHTML=Object.keys(RCOL).map(r=>opt(r,r)).join('');
am.innerHTML=Object.entries(MODES).filter(([k])=>k!=='all').map(([k,v])=>opt(k,v)).join('');
at.innerHTML=opt('','— ไม่มี Tier (ลบ) —')+Object.keys(PTS).map(t=>opt(t,t)).join('');
const find=n=>PLAYERS.find(p=>p.n.toLowerCase()===n.trim().toLowerCase());
function sync(){const p=find(an.value);if(p){ar.value=p.r;at.value=p.t[am.value]||'';ast.textContent='ผู้เล่นเดิม · '+pts(p)+' แต้ม'}else ast.textContent=an.value.trim()?'จะเพิ่มเป็นผู้เล่นใหม่':''}
an.oninput=sync;am.onchange=sync;
adm.onclick=()=>{pl.innerHTML=PLAYERS.map(p=>`<option value="${p.n}">`).join('');sync();adlg.showModal()};
async function save(){
 try{if(!dbDoc)throw{message:'ยังไม่ได้เชื่อมต่อฐานข้อมูล'};await dbDoc.set({players:PLAYERS});ast.textContent='✅ บันทึกแล้ว'}
 catch(e){ast.textContent='❌ บันทึกไม่สำเร็จ: '+(e.message||e.code)}
}
asv.onclick=()=>{
 const n=an.value.trim();if(!n){ast.textContent='กรุณาใส่ชื่อผู้เล่น';return}
 let p=find(n);if(!p){p={n,r:ar.value,t:{}};PLAYERS=[...PLAYERS,p]}
 p.r=ar.value;if(at.value)p.t[am.value]=at.value;else delete p.t[am.value];
 render();save();
};
let armed=false;
adel.onclick=()=>{
 const p=find(an.value);if(!p){ast.textContent='ไม่พบผู้เล่น';return}
 if(!armed){armed=true;adel.textContent='กดอีกครั้งเพื่อยืนยันลบ';setTimeout(()=>{armed=false;adel.textContent='ลบผู้เล่น'},3000);return}
 armed=false;adel.textContent='ลบผู้เล่น';PLAYERS=PLAYERS.filter(x=>x!==p);an.value='';render();save();
};
(async()=>{
 try{
  if(typeof claude==='undefined')return;
  const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
  if(!db)return;
  dbDoc=db.doc('site/data');
  dbDoc.onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&Array.isArray(d.players)){PLAYERS=d.players;render()}});
  if(user&&await user.canEdit())adm.hidden=false;
 }catch(e){}
})();
render();
</script>
</body>
</html>
